<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Joken-Pow</title>
</head>
<body>
    <main class="container">
        
            <div class="results">
                <div>
                    <span class="user-result">
                       
                        <img src="./assets/pedra.png" alt="escolha do usuario" >
                    </span>
    
                    <span class="computer-result">
                        <img src="./assets/pedra.png" alt="escolha do computador" >
                    </span>
                </div>
                <p class="result-text">Bora Jogar ?</p>
            </div>

            <div class="options">
                <span class="option-image">
                    <img src="./assets/pedra.png" alt="imagem pedra" >
                    <p>Pedra</p>
                </span>

                <span class="option-image">
                    <img src="./assets/papel.png" alt="imagem papel" >
                    <p>Papel</p>
                </span>

                <span class="option-image">
                    <img src="./assets/tesoura.png" alt=" imagem tesoura" >
                    <p>Tesoura</p>
                </span>

            </div>

    </main>
    
</body>
<script src="script.js"></script>
</html>
